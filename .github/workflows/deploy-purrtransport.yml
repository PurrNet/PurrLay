name: Deploy Purr Transport

on:
  workflow_dispatch:
    inputs:
      initial_legacy_cutover:
        description: 'One-time legacy cutover: discard old balancer directory; keep regional relays running'
        type: boolean
        default: false

concurrency:
  group: purrtransport-production-generations
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: purrtransport
  APP_DOMAIN: purrservers.com
  BAL_REGION: cdg
  DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP_SECRET: ${{ secrets.PURR_APP_SECRET }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  balancer:
    name: Deploy balancer with live state handoff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Test session preservation and handoff recovery
        run: dotnet test PurrLay.Tests/PurrLay.Tests.csproj --configuration Release --nologo
      - name: Test deployment safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify Linux private IPv6 handoff
        run: |
          docker build --file PurrBalancer/dockerfile --tag purrbalancer-ipv6-smoke:local PurrBalancer
          docker pull golang:1.26
          python3 PurrLay.Tests/balancer_ipv6_smoke.py --image purrbalancer-ipv6-smoke:local --probe-image golang:1.26
      - name: Verify stable balancer network
        run: >-
          python3 .github/scripts/fly_generations.py network
          --app "$APP_NAME" --domain "$APP_NAME.$APP_DOMAIN"
      - name: Build and push balancer image without deploying
        timeout-minutes: 15
        working-directory: PurrBalancer
        run: >-
          flyctl deploy --build-only --push --local-only
          --app "$APP_NAME" --image-label "generation-$DEPLOYMENT_ID"
      - name: Start successor, transfer authority and retain predecessor dependencies
        env:
          INITIAL_LEGACY_CUTOVER: ${{ inputs.initial_legacy_cutover }}
        run: |
          cutover_args=()
          if [[ "$INITIAL_LEGACY_CUTOVER" == "true" ]]; then
            cutover_args+=(--initial-legacy-cutover)
          fi
          python3 .github/scripts/fly_generations.py balancer \
            --app "$APP_NAME" --region "$BAL_REGION" --deployment "$DEPLOYMENT_ID" \
            --image "registry.fly.io/$APP_NAME:generation-$DEPLOYMENT_ID" \
            --public-url "https://$APP_NAME.$APP_DOMAIN" "${cutover_args[@]}"

  relays:
    name: Deploy relay (${{ matrix.prefix }})
    needs: balancer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { region: cdg, prefix: france }
          - { region: gru, prefix: brazil }
          - { region: jnb, prefix: south-africa }
          - { region: ewr, prefix: nj-us }
          - { region: nrt, prefix: japan }
          - { region: syd, prefix: australia }
          - { region: hkg, prefix: china }
    env:
      RELAY_APP: purrtransport-${{ matrix.prefix }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify stable relay network and dedicated UDP IPv4
        id: network
        run: >-
          python3 .github/scripts/fly_generations.py network
          --app "$RELAY_APP" --domain "$RELAY_APP.$APP_DOMAIN" --udp
      - name: Build and push relay image without deploying
        timeout-minutes: 15
        working-directory: PurrLay
        run: >-
          flyctl deploy --build-only --push --local-only
          --app "$RELAY_APP" --image-label "generation-$DEPLOYMENT_ID"
      - name: Start isolated relay, activate new allocations and drain predecessors
        env:
          WEBRTC_PUBLIC_IP: ${{ steps.network.outputs.public_ip }}
        run: >-
          python3 .github/scripts/fly_generations.py relay
          --app "$RELAY_APP" --region "${{ matrix.region }}" --prefix "${{ matrix.prefix }}"
          --domain "$RELAY_APP.$APP_DOMAIN" --public-ip "$WEBRTC_PUBLIC_IP"
          --deployment "$DEPLOYMENT_ID" --image "registry.fly.io/$RELAY_APP:generation-$DEPLOYMENT_ID"
          --balancer "https://$APP_NAME.$APP_DOMAIN"
